name: Market Close Retrospective

on:
  schedule:
    # Run at 8:00 UTC = 15:00 Vietnam time (GMT+7)
    # Market closes at 14:30, this runs 30 min after
    # Only on weekdays (Mon-Fri)
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

# SWI-261: bucket scheduled runs by start timestamp; manual dispatches share
# a single bucket so storms still cap. The acquire_marker step + retry job
# below catch runner-acquisition failures (the job-never-started case that
# step-level retries cannot help).
concurrency:
  group: market-close-retro-${{ github.event.schedule != '' && format('sched-{0}', github.run_started_at) || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  retrospective:
    # Scheduled runs stay off in forks: they need secrets a fork will not have.
    if: github.event_name != 'schedule' || github.repository == 'OWNER/trade-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      acquired: ${{ steps.acquire_marker.outputs.acquired }}

    steps:
      - id: acquire_marker
        name: Mark runner as acquired
        run: echo "acquired=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check market status
        id: market_check
        working-directory: scripts
        run: |
          if uv run python -m shared.market_calendar; then
            echo "trading=true" >> $GITHUB_OUTPUT
          else
            echo "trading=false" >> $GITHUB_OUTPUT
            echo "Market holiday — skipping retrospective"
          fi

      - name: Cache HuggingFace models
        if: steps.market_check.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-minilm-v1

      - name: Run retrospective analysis
        # Two-tier retry: step-level (nick-fields/retry@v3) for transient LLM
        # failures; workflow-level (retry-on-runner-unavailable job below)
        # for runner-acquisition failures.
        if: steps.market_check.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: production
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_API_URL: ${{ secrets.VNSTOCK_API_URL }}
          SWINGY_TOOL_STRICT: "1"
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 60
          retry_wait_seconds: 300
          shell: bash
          command: uv run python scripts/retrospective.py

      - name: Send Telegram notification
        if: steps.market_check.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/retro_notify.py

  retry-on-runner-unavailable:
    # SWI-261: re-dispatches the workflow when the primary job's runner was
    # never acquired. Brake threshold `< 1` caps to a single self-spawned
    # re-dispatch per 15-minute failure window — sustained GH outages do
    # not loop. Only failed `workflow_dispatch` runs count toward the cap.
    needs: retrospective
    if: (failure() || cancelled()) && needs.retrospective.outputs.acquired != 'true'
    runs-on: ubuntu-latest
    steps:
      - id: recent_redispatches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh run list \
            --workflow=market-close-retro.yml \
            --created='-15 minutes' \
            --event=workflow_dispatch \
            --json status,conclusion \
            --jq '[.[] | select(.conclusion != "success")] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Re-dispatch on runner-unavailable
        if: fromJSON(steps.recent_redispatches.outputs.count) < 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run market-close-retro.yml --ref ${{ github.ref_name }}
