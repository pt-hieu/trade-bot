name: Catalyst Check

on:
  schedule:
    # 3x/day on weekdays during Vietnam trading hours:
    # 03:00 UTC = 10:00 AM VN (after morning open, first check)
    # 06:30 UTC = 1:30 PM VN (after lunch break, second check)
    # 08:00 UTC = 3:00 PM VN (before close, final check)
    - cron: '0 3 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

# SWI-261: scheduled runs bucket by start timestamp; manual dispatches share
# a single bucket. Acquire-marker step + retry job below catch
# runner-acquisition failures.
concurrency:
  group: catalyst-check-${{ github.event.schedule != '' && format('sched-{0}', github.run_started_at) || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  catalyst-check:
    # Scheduled runs stay off in forks: they need secrets a fork will not have.
    if: github.event_name != 'schedule' || github.repository == 'OWNER/trade-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      acquired: ${{ steps.acquire_marker.outputs.acquired }}

    steps:
      - id: acquire_marker
        name: Mark runner as acquired
        run: echo "acquired=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check market status
        id: market_check
        working-directory: scripts
        run: |
          if uv run python -m shared.market_calendar; then
            echo "trading=true" >> $GITHUB_OUTPUT
          else
            echo "trading=false" >> $GITHUB_OUTPUT
            echo "Market holiday — skipping catalyst check"
          fi

      - name: Run catalyst check
        if: steps.market_check.outputs.trading == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SWINGY_ENV: production
          # SWI-261: bump pool ceiling for the catalyst-check spike path,
          # which holds a session-scoped advisory lock_conn for the entire
          # body. Default 10 leaves no headroom for nested gather fan-out.
          SWINGY_PG_POOL_MAX: "20"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_API_URL: ${{ secrets.VNSTOCK_API_URL }}
        run: uv run python scripts/catalyst_check.py

  retry-on-runner-unavailable:
    # SWI-261: re-dispatches when the primary job's runner was never
    # acquired. Single re-dispatch per 15-minute failure window.
    needs: catalyst-check
    if: (failure() || cancelled()) && needs.catalyst-check.outputs.acquired != 'true'
    runs-on: ubuntu-latest
    steps:
      - id: recent_redispatches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh run list \
            --workflow=catalyst-check.yml \
            --created='-15 minutes' \
            --event=workflow_dispatch \
            --json status,conclusion \
            --jq '[.[] | select(.conclusion != "success")] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Re-dispatch on runner-unavailable
        if: fromJSON(steps.recent_redispatches.outputs.count) < 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run catalyst-check.yml --ref ${{ github.ref_name }}
