name: Lint & Type Check

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check scripts/ tests/ evals/

      - name: Ruff format check
        run: uv run ruff format --check scripts/ tests/ evals/

      - name: Async-sync lint
        run: uv run python scripts/lint_async_sync.py

      - name: Pyright type check
        run: uv run pyright

      - name: Validate agent YAML configs
        run: |
          uv run python -c "
          import sys, yaml
          sys.path.insert(0, 'scripts')
          from shared.agent_config import load_agent_config
          import asyncio
          from pathlib import Path
          configs = sorted(Path('scripts/agents/configs').glob('*.yaml'))
          assert len(configs) >= 30, f'Expected 30+ configs, found {len(configs)}'
          for f in configs:
              key = f.stem
              asyncio.run(load_agent_config(key))
              print(f'  OK {key}')
          print(f'Validated {len(configs)} agent configs')
          "
