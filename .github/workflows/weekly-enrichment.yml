name: Weekly Earnings Calendar Refresh

on:
  schedule:
    # Run Saturday 8 AM Vietnam time (1:00 AM UTC = GMT+7)
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    # Scheduled runs stay off in forks: they need secrets a fork will not have.
    if: github.event_name != 'schedule' || github.repository == 'OWNER/trade-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh earnings calendar
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          VNSTOCK_API_URL: ${{ secrets.VNSTOCK_API_URL }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SWINGY_ENV: production
        run: uv run python scripts/data/enrich_events.py
