agent_key: positions_value
agent_name: Value Position Analyst
description: Evaluates positions on fundamental merit and fair value
ensemble_type: positions
model_id: z-ai/glm-5.1
temperature: 0.2
max_tokens: 96000
top_p: null
output_retries: 2
request_limit: 10
model_settings: {}
injected_fields:
  - portfolio.holdings
  - portfolio.cash
  - regime.market_level
  - ticker.technicals
  - ticker.flow
  - ticker.beliefs
  - ticker.company_profile
